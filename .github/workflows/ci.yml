name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Security audit
        working-directory: backend
        run: pip-audit --skip-editable
      - name: Lint
        working-directory: backend
        run: ruff check app tests
      - name: Types
        working-directory: backend
        run: pyright
      - name: Tests
        working-directory: backend
        run: pytest -q

  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rinavi
          POSTGRES_PASSWORD: rinavi
          POSTGRES_DB: rinavi_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rinavi -d rinavi_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RINAVI_ENVIRONMENT: test
      # pytest must run against Postgres here. RINAVI_TEST_DATABASE_URL is the
      # only database override conftest.py honors; RINAVI_DATABASE_URL is set
      # on the Alembic steps only, so the suite cannot silently fall back to
      # SQLite.
      RINAVI_TEST_DATABASE_URL: postgresql+asyncpg://rinavi:rinavi@localhost:5432/rinavi_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Assert Postgres test target
        working-directory: backend
        run: >-
          python -c "import os; from sqlalchemy.engine import make_url;
          url = os.environ['RINAVI_TEST_DATABASE_URL'];
          assert make_url(url).get_backend_name() == 'postgresql', url"
      - name: Migrations
        working-directory: backend
        env:
          RINAVI_DATABASE_URL: postgresql+asyncpg://rinavi:rinavi@localhost:5432/rinavi_test
        run: python -m alembic upgrade head
      # Must stay before Tests: the suite drops and recreates every table
      # from metadata, so a check after it would compare metadata against
      # itself and fake a migration-path pass.
      - name: Schema check
        working-directory: backend
        env:
          RINAVI_DATABASE_URL: postgresql+asyncpg://rinavi:rinavi@localhost:5432/rinavi_test
        run: python -m alembic check
      - name: Tests
        working-directory: backend
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install
        working-directory: apps/web
        run: npm ci
      - name: Security audit
        working-directory: apps/web
        run: npm audit --omit=dev
      - name: Lint
        working-directory: apps/web
        run: npm run lint
      - name: Typegen
        working-directory: apps/web
        run: npx next typegen
      - name: Types
        working-directory: apps/web
        run: npx tsc --noEmit
      - name: Tests
        working-directory: apps/web
        run: npm run test -- --run
      - name: Build
        working-directory: apps/web
        run: npm run build
