name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Lint
        working-directory: backend
        run: ruff check app tests
      - name: Types
        working-directory: backend
        run: pyright
      - name: Tests
        working-directory: backend
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        working-directory: apps/web
        run: npm ci
      - name: Lint
        working-directory: apps/web
        run: npm run lint
      - name: Typegen
        working-directory: apps/web
        run: npx next typegen
      - name: Types
        working-directory: apps/web
        run: npx tsc --noEmit
      - name: Tests
        working-directory: apps/web
        run: npm run test -- --run
      - name: Build
        working-directory: apps/web
        run: npm run build
