name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Security audit
        working-directory: backend
        run: pip-audit --skip-editable
      - name: Lint
        working-directory: backend
        run: ruff check app tests
      - name: Types
        working-directory: backend
        run: pyright
      - name: Tests
        working-directory: backend
        run: pytest -q

  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rinavi
          POSTGRES_PASSWORD: rinavi
          POSTGRES_DB: rinavi_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rinavi -d rinavi_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RINAVI_ENVIRONMENT: test
      # pytest must run against Postgres here. RINAVI_TEST_DATABASE_URL is the
      # only database override conftest.py honors; RINAVI_DATABASE_URL is set
      # on the Alembic steps only, so the suite cannot silently fall back to
      # SQLite.
      RINAVI_TEST_DATABASE_URL: postgresql+asyncpg://rinavi:rinavi@localhost:5432/rinavi_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Assert Postgres test target
        working-directory: backend
        run: >-
          python -c "import os; from sqlalchemy.engine import make_url;
          url = os.environ['RINAVI_TEST_DATABASE_URL'];
          assert make_url(url).get_backend_name() == 'postgresql', url"
      - name: Migrations
        working-directory: backend
        env:
          RINAVI_DATABASE_URL: postgresql+asyncpg://rinavi:rinavi@localhost:5432/rinavi_test
        run: python -m alembic upgrade head
      # Must stay before Tests: the suite drops and recreates every table
      # from metadata, so a check after it would compare metadata against
      # itself and fake a migration-path pass.
      - name: Schema check
        working-directory: backend
        env:
          RINAVI_DATABASE_URL: postgresql+asyncpg://rinavi:rinavi@localhost:5432/rinavi_test
        run: python -m alembic check
      - name: Tests
        working-directory: backend
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install
        working-directory: apps/web
        run: npm ci
      - name: Security audit
        working-directory: apps/web
        run: npm audit --omit=dev
      - name: Lint
        working-directory: apps/web
        run: npm run lint
      - name: Typegen
        working-directory: apps/web
        run: npx next typegen
      - name: Types
        working-directory: apps/web
        run: npx tsc --noEmit
      - name: Tests
        working-directory: apps/web
        run: npm run test -- --run
      - name: Build
        working-directory: apps/web
        run: npm run build

  # Builds the demo images and validates the compose file, so an image
  # regression shows up on the PR instead of at a demo. Deliberately not the
  # full smoke: it takes minutes and stays a local, pre-demo step.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect image-relevant changes
        id: changes
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
            if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              # A first or rewritten push has no usable base; build anyway.
              echo "images=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if git diff --name-only "$base" HEAD | grep -Eq '^(backend/|apps/web/|infra/compose/|\.github/workflows/ci\.yml)'; then
            echo "images=true" >> "$GITHUB_OUTPUT"
          else
            echo "images=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Buildx
        if: steps.changes.outputs.images == 'true'
        uses: docker/setup-buildx-action@v4
      - name: Build backend image
        if: steps.changes.outputs.images == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          tags: rinavi-backend:ci
          load: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build web image
        if: steps.changes.outputs.images == 'true'
        uses: docker/build-push-action@v7
        with:
          context: apps/web
          file: apps/web/Dockerfile
          tags: rinavi-web:ci
          load: true
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Validate the compose file
        if: steps.changes.outputs.images == 'true'
        working-directory: infra/compose
        run: docker compose config --quiet
      - name: Assert the image contract
        if: steps.changes.outputs.images == 'true'
        run: |
          set -euo pipefail
          uid="$(docker run --rm --entrypoint id rinavi-backend:ci -u)"
          test "$uid" = "10001" || { echo "expected uid 10001, got '$uid'"; exit 1; }
          docker run --rm --entrypoint sh rinavi-backend:ci -c \
            'test -x /app/backend/docker-entrypoint.sh && grep -q "alembic upgrade head" /app/backend/docker-entrypoint.sh'
          docker image inspect rinavi-web:ci > /dev/null

  # Manual only: it needs the whole compose stack, and the unit and integration
  # suites already run on every PR. Kept off PRs so review stays fast.
  e2e:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Start the demo stack
        run: docker compose -f infra/compose/compose.yaml up --build -d --wait
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Browser journey
        working-directory: apps/web
        run: npm run test:e2e
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Stack logs
        if: always()
        run: docker compose -f infra/compose/compose.yaml logs --no-color
      - name: Tear down
        if: always()
        run: docker compose -f infra/compose/compose.yaml down -v
