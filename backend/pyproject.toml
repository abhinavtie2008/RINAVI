[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rinavi-backend"
version = "0.1.0"
description = "RINAVI modular monolith backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "webauthn>=2.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "asyncpg>=0.32",
    "alembic>=1.14",
    "email-validator>=2.2",
    "pydantic>=2.12",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.20",
    "pypdf>=5.1",
    # The global budget middleware calls slowapi internals
    # (slowapi.middleware.sync_check_limits and Limiter._inject_headers), so a
    # breaking release would stop every request rather than degrade. 0.1.10 is
    # the version the suite runs against; cap before 0.2 and re-verify these
    # two APIs before widening the range.
    "slowapi>=0.1.9,<0.2",
]

[project.optional-dependencies]
redis = [
    "redis>=5.0",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.9",
    "pyright>=1.1.390",
    "pip-audit>=2.7",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pyright]
include = ["app", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "basic"
